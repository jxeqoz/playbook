---
title: Initialization
description: Copies Revision folders/files, and configures some initial settings
privilege: TrustedInstaller
actions:
  
  - !writeStatus: {status: "Initializing"}

  # Prevent annoying notifications during deployment
  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings\Windows.SystemToast.SecurityAndMaintenance'
    value: 'Enabled'
    type: REG_DWORD
    data: '0'

  # No C:\Licenses folder: the licenses ship inside the playbook archive

  # hosts file is left stock: Defender stays on and flags hosts entries that block Microsoft domains

  - !writeStatus: {status: "Installing VCRedist"}
  - !download: 
    url: 'https://aka.ms/vs/17/release/vc_redist.x64.exe'
    destination: "vc_redist.x64.exe"
    overwrite: true
  - !run:
    exeDir: true
    exe: "vc_redist.x64.exe"
    args: '/quiet /norestart'

  - !writeStatus: {status: "Optimizing PowerShell"}
  - !run:
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -ExecutionPolicy Bypass -File ngen.ps1'
  # Ultimate Performance copy with core parking off (CPMINCORES/CPMINCORES1 = 100%) and USB 3 link power management off.
  # Same values Revision Tool applied; the PERFINC/PERFDEC knobs it also set are ignored on HWP CPUs, so they are skipped.
    weight: 100

  - !writeStatus: {status: "Configuring a power plan"}
  - !powerShell:
    wait: true
    runas: currentUserElevated
