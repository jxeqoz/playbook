---
title: APPX
description: Removal of APPX packages
privilege: TrustedInstaller
actions:
  
  - !writeStatus: {status: "Removing Appx Packages"}
  - !powerShell:
    wait: true
    exeDir: true
    errorAction: Ignore
    weight: 48
    command: >-
       $packages = @(
        'Microsoft.Windows.SecureAssessmentBrowser',
        'Microsoft.Windows.PeopleExperienceHost',
        'Microsoft.WindowsCamera',
        'MicrosoftWindows.Client.WebExperience',
        'Microsoft.WidgetsPlatformRuntime',
        'Microsoft.WindowsAlarms',
        'Microsoft.WindowsMaps',
        'Microsoft.MicrosoftStickyNotes',
        'microsoft.windowscommunicationsapps',
        'Microsoft.People',
        'Microsoft.BingNews',
        'Microsoft.BingSearch',
        'Microsoft.BingWeather',
        'Microsoft.MicrosoftSolitaireCollection',
        'Microsoft.WindowsFeedbackHub',
        'Microsoft.GetHelp',
        'Microsoft.Getstarted',
        'Microsoft.Todos',
        'Microsoft.PowerAutomateDesktop',
        'Microsoft.549981C3F5F10', # Cortana
        'MicrosoftCorporationII.QuickAssist',
        'MicrosoftCorporationII.MicrosoftFamily',
        'Microsoft.ZuneMusic',
        'Microsoft.ZuneVideo',
        'Microsoft.WindowsSoundRecorder',
        'Clipchamp.Clipchamp',
        'Microsoft.Whiteboard',
        'Microsoft.MicrosoftTeamsforSurfaceHub',
        'MicrosoftCorporationII.MailforSurfaceHub',
        'Microsoft.MicrosoftPowerBIForWindows',
        'Microsoft.SkypeApp',
        'Microsoft.MicrosoftOfficeHub',
        'Microsoft.Office.Excel',
        'Microsoft.Office.PowerPoint',
        'Microsoft.Office.Word',
        'Microsoft.Office.OneNote',
        'Microsoft.OutlookForWindows',
        'SpotifyAB.SpotifyMusic',
        'OutlookPWA',
        'Microsoft.Microsoft3DViewer',
        'Microsoft.Advertising',
        'MixedReality.Portal',
        'Microsoft.MSPaint', # Paint 3D
        'Microsoft.StartExperiencesApp'
        );

        & .\APPX.ps1 -Name $packages

  - !writeStatus: {status: "Removing Photos"}
  - !powerShell:
    option: "remove-appx-photos"
    wait: true
    exeDir: true
    errorAction: Ignore
    weight: 10
    command: >-
      & .\APPX.ps1 -Name 'Microsoft.Windows.Photos'

  - !writeStatus: {status: "Removing Dev Home", option: "remove-appx-devhome"}
  - !powerShell:
    option: "remove-appx-devhome"
    wait: true
    exeDir: true
    errorAction: Ignore
    weight: 10
    command: >-
      & .\APPX.ps1 -Name 'Microsoft.Windows.DevHome'

  - !writeStatus: {status: "Removing Your Phone", option: "remove-appx-yourphone"}
  - !powerShell:
    option: "remove-appx-yourphone"
    wait: true
    exeDir: true
    errorAction: Ignore
    weight: 20
    command: >-
      $packages = @(
        'Microsoft.YourPhone',
        'MicrosoftWindows.CrossDevice'
      );
      & .\APPX.ps1 -Name $packages

  # Xbox apps only; Xbox Identity Provider and TCUI stay so games can still sign in to Xbox services
  - !writeStatus: {status: "Removing Xbox", option: "remove-appx-xbox"}
  - !powerShell:
    option: "remove-appx-xbox"
    wait: true
    exeDir: true
    errorAction: Ignore
    runas: currentUserElevated
    weight: 20
    command: >-
      $packages = @(
        'Microsoft.GamingApp',
        'Microsoft.XboxGamingOverlay',
        'Microsoft.XboxGameOverlay',
        'Microsoft.XboxSpeechToTextOverlay'
      );
      & .\APPX.ps1 -Name $packages
  # #139: without Game Bar, games open ms-gamebar/ms-gamingoverlay links; point them at a no-op so no "get an app" prompt appears
  - !registryValue: {path: 'HKCR\ms-gamebar', value: '', type: REG_SZ, data: 'URL:ms-gamebar', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCR\ms-gamebar', value: 'URL Protocol', type: REG_SZ, data: '', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCR\ms-gamebar\shell\open\command', value: '', type: REG_EXPAND_SZ, data: '%SystemRoot%\System32\systray.exe', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCR\ms-gamingoverlay', value: '', type: REG_SZ, data: 'URL:ms-gamingoverlay', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCR\ms-gamingoverlay', value: 'URL Protocol', type: REG_SZ, data: '', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCR\ms-gamingoverlay\shell\open\command', value: '', type: REG_EXPAND_SZ, data: '%SystemRoot%\System32\systray.exe', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCU\Software\Microsoft\GameBar', value: 'ShowStartupPanel', type: REG_DWORD, data: '0', option: "remove-appx-xbox"}
